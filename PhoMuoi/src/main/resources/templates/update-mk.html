<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cập Nhật Trang Cá Nhân - PhoMuoi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        /* KHÔNG CHO PHÉP FLEXBOX CO ÉP CHIỀU CAO HEADER & FOOTER */
        .navbar {
            flex-shrink: 0 !important;
        }
        .phomuoi-footer {
            flex-shrink: 0 !important;
        }

        .main-container {
            flex: 1 0 auto;
            max-width: 600px;
            width: 100%;
            margin: 50px auto;
            padding: 0 15px;
        }

        /* Thiết kế khung Form Card mới, tinh tế, đổ bóng mềm */
        .form-card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            padding: 40px;
        }

        .form-title {
            font-size: 24px;
            font-weight: 700;
            color: #121ba6;
            margin-bottom: 30px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group-custom {
            margin-bottom: 22px;
        }

        .form-label-custom {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-control-custom {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease-in-out;
            background-color: #fff;
        }

        .form-control-custom:focus {
            border-color: #121ba6;
            box-shadow: 0 0 0 4px rgba(18, 27, 166, 0.12);
            outline: none;
        }

        /* Vùng hiển thị quyền Admin cố định (Không thể chỉnh sửa) */
        .role-readonly-container {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 14px 18px;
            border: 1px solid #e9ecef;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 35px;
        }

        .role-label-left {
            font-size: 13px;
            color: #6c757d;
            font-weight: 600;
        }

        .role-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.3px;
        }
        .badge-admin { background: #fee2e2; color: #ef4444; }
        .badge-user { background: #dcfce7; color: #22c55e; }

        /* Nút cập nhật màu đỏ nổi bật nhưng bo góc hiện đại */
        .btn-submit-custom {
            background-color: #ef4444; 
            color: white;
            padding: 14px 30px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            transition: 0.3s;
            width: 100%;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }

        .btn-submit-custom:hover {
            background-color: #dc3545;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.3);
        }

        .btn-submit-custom:active {
            transform: translateY(0);
        }

        .btn-back-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #6c757d;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: 0.2s;
        }

        .btn-back-link:hover {
            color: #121ba6;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="main-container">
        <div class="form-card">
            <h1 class="form-title">Cập Nhật Trang Cá Nhân</h1>

            <form th:action="@{/tai-khoan/update}" method="POST" enctype="multipart/form-data" class="d-flex flex-column">
                
                <div class="form-group-custom">
                    <label class="form-label-custom">
                        <i class="fa-solid fa-user text-muted"></i> Tên:
                    </label>
                    <input type="text" class="form-control form-control-custom w-100" name="tenKhach" 
                           th:value="${user.tenKhach}" placeholder="Nhập họ và tên của bạn" required>
                </div>

                <div class="form-group-custom">
                    <label class="form-label-custom">
                        <i class="fa-solid fa-phone text-muted"></i> Số điện thoại:
                    </label>
                    <input type="tel" class="form-control form-control-custom w-100" name="sdt" 
                           th:value="${user.sdt}" placeholder="Nhập số điện thoại" required
                           pattern="[0-9]{10,11}" title="Vui lòng nhập số điện thoại hợp lệ từ 10 đến 11 số">
                </div>

                <div class="form-group-custom">
                    <label class="form-label-custom">
                        <i class="fa-solid fa-location-dot text-muted"></i> Địa chỉ:
                    </label>
                    <input type="text" class="form-control form-control-custom w-100" name="diaChi" 
                           th:value="${user.diaChi}" placeholder="Nhập địa chỉ giao hàng mặc định" required>
                </div>

                <div class="form-group-custom">
                    <label class="form-label-custom">
                        <i class="fa-solid fa-image text-muted"></i> Ảnh đại diện:
                    </label>
                    <input type="file" class="form-control form-control-custom w-100" name="anhProfile" accept="image/*">
                    <div class="form-text text-muted mt-2" style="font-size: 12px; font-weight: 500;">
                        Lưu ý: Chỉ chọn file ảnh mới nếu bạn muốn đổi ảnh đại diện.
                    </div>
                </div>

                <div class="form-group-custom mt-2">
                    <label class="form-label-custom">
                        <i class="fa-solid fa-shield-halved text-muted"></i> Cấp bậc tài khoản:
                    </label>
                    <div class="role-readonly-container">
                        <span class="role-label-left"><i class="fa-solid fa-lock me-1"></i> Không thể tự thay đổi quyền</span>
                        <span th:if="${user.roleAdmin == 1}" class="role-badge badge-admin">QUẢN TRỊ VIÊN</span>
                        <span th:if="${user.roleAdmin != 1}" class="role-badge badge-user">KHÁCH HÀNG</span>
                    </div>
                </div>

                <button type="submit" class="btn-submit-custom">
                    Cập nhật
                </button>

                <a th:href="@{/tai-khoan}" class="btn-back-link">
                    <i class="fa-solid fa-chevron-left me-1" style="font-size: 11px;"></i> Quay lại trang cá nhân
                </a>

            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footerMain}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
