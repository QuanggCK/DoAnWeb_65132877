<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký - PhoMuoi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-image: url('/images/bg/quan.jpg');
		    background-size: cover;
		    background-position: center;
		    background-attachment: fixed;
		    background-repeat: no-repeat;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
        }

        .main-container {
            max-width: 500px;
            width: 100%;
            margin: auto;
            padding: 20px 15px;
        }

        .register-card {

    		background: rgba(255, 255, 255, 0.92);
    		backdrop-filter: blur(6px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px;
        }

        .register-title {
            font-size: 24px;
            font-weight: 700;
            color: #121ba6;
            text-align: center;
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
        }

        .form-label-custom {
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
        }

        .form-control-custom {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1px solid #ced4da;
            font-size: 15px;
            font-family: 'Montserrat', sans-serif;
            transition: all 0.2s;
        }

        .form-control-custom:focus {
            border-color: #121ba6;
            box-shadow: 0 0 0 4px rgba(18, 27, 166, 0.12);
            outline: none;
        }

        .btn-register {
            background-color: #121ba6;
            color: white;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            width: 100%;
            transition: 0.3s;
            font-family: 'Montserrat', sans-serif;
        }

        .btn-register:hover {
            background-color: #0d1480;
            transform: translateY(-2px);
        }

        .divider {
            border: none;
            border-top: 1px solid #f1f1f1;
            margin: 20px 0;
        }
    </style>
</head>
<body>


    <main class="main-container">
        <div class="register-card">
            <h1 class="register-title">Đăng Ký</h1>

            <!-- Thông báo lỗi -->
            <div th:if="${error}" class="alert alert-danger rounded-3 mb-3" th:text="${error}"></div>

            <form th:action="@{/register}" th:object="${user}" method="POST" class="d-flex flex-column gap-3">

                <div>
                    <label class="form-label-custom">
                        <i class="fa-solid fa-user text-muted me-1"></i> Họ và Tên
                    </label>
                    <input type="text" th:field="*{tenKhach}"
                           class="form-control form-control-custom"
                           placeholder="Nhập họ và tên của bạn" required>
                </div>

                <div>
                    <label class="form-label-custom">
                        <i class="fa-solid fa-phone text-muted me-1"></i> Số điện thoại
                    </label>
                    <input type="tel" th:field="*{sdt}"
                           class="form-control form-control-custom"
                           placeholder="Nhập số điện thoại"
                           pattern="[0-9]{10,11}"
                           title="Vui lòng nhập số điện thoại từ 10 đến 11 số"
                           required>
                </div>

                <div>
                    <label class="form-label-custom">
                        <i class="fa-solid fa-lock text-muted me-1"></i> Mật khẩu
                    </label>
                    <input type="password" th:field="*{matKhau}"
                           class="form-control form-control-custom"
                           placeholder="Nhập mật khẩu" required>
                </div>

                <div>
                    <label class="form-label-custom">
                        <i class="fa-solid fa-location-dot text-muted me-1"></i> Địa chỉ
                    </label>
                    <input type="text" th:field="*{diaChi}"
                           class="form-control form-control-custom"
                           placeholder="Nhập địa chỉ giao hàng mặc định" required>
                </div>

                <button type="submit" class="btn-register mt-1">
                    <i class="fa-solid fa-user-plus me-2"></i> Đăng ký
                </button>

                <hr class="divider">

                <p class="text-center text-muted mb-0" style="font-size: 14px;">
                    Đã có tài khoản?
                    <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color: #121ba6;">
                        Đăng nhập ngay
                    </a>
                </p>

            </form>
        </div>
    </main>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
