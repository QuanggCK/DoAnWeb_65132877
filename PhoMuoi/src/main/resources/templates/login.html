<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập - PhoMuoi</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Montserrat', sans-serif;
            display: flex; flex-direction: column; min-height: 100vh;
        }
        .main-container {
            flex: 1; max-width: 480px; width: 100%;
            margin: 60px auto; padding: 0 15px;
        }
        .login-card {
            background: white; border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 40px;
        }
        .login-title {
            font-size: 24px; font-weight: 700; color: #121ba6;
            text-align: center; text-transform: uppercase; margin-bottom: 30px;
        }
        .form-control-custom {
            border-radius: 10px; padding: 12px 16px;
            border: 1px solid #ced4da; font-size: 15px;
        }
        .form-control-custom:focus {
            border-color: #121ba6;
            box-shadow: 0 0 0 4px rgba(18,27,166,0.12);
        }
        .btn-login {
            background-color: #121ba6; color: white;
            padding: 13px; border-radius: 10px; border: none;
            font-weight: 600; font-size: 16px; width: 100%;
            transition: 0.3s;
        }
        .btn-login:hover { background-color: #0d1480; transform: translateY(-2px); }
    </style>
</head>
<body>

    <main class="main-container">
        <div class="login-card">
            <h1 class="login-title">Đăng Nhập</h1>

            <!-- Thông báo lỗi -->
            <div th:if="${error}" class="alert alert-danger rounded-3" th:text="${error}"></div>
            <!-- Thông báo đăng ký thành công -->
            <div th:if="${param.success}" class="alert alert-success rounded-3">
                Đăng ký thành công! Vui lòng đăng nhập.
            </div>

            <form th:action="@{/login}" method="POST" class="d-flex flex-column gap-3">
                <div>
                    <label class="form-label fw-600">
                        <i class="fa-solid fa-phone text-muted me-1"></i> Số điện thoại
                    </label>
                    <input type="tel" name="sdt" class="form-control form-control-custom"
                           placeholder="Nhập số điện thoại" required>
                </div>

                <div>
                    <label class="form-label fw-semibold">
                        <i class="fa-solid fa-lock text-muted me-1"></i> Mật khẩu
                    </label>
                    <input type="password" name="mat_khau" class="form-control form-control-custom"
                           placeholder="Nhập mật khẩu" required>
                </div>

                <button type="submit" class="btn-login mt-2">
                    <i class="fa-solid fa-right-to-bracket me-2"></i> Đăng nhập
                </button>

                <p class="text-center text-muted mt-2" style="font-size:14px;">
                    Chưa có tài khoản?
                    <a th:href="@{/register}" class="text-decoration-none fw-semibold" style="color:#121ba6;">
                        Đăng ký ngay
                    </a>
                </p>
            </form>
        </div>
    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
