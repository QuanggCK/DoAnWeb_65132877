<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <div th:fragment="sideBarMain" class="phomuoi-sidebar shadow-sm">
        
        <div class="sidebar-header">
            <i class="fa-solid fa-bars-staggered me-2"></i>
            <span>DANH MỤC MENU</span>
        </div>

        <div class="sidebar-menu">
            <a th:href="@{/danh-muc/1}" 
               class="sidebar-item"
               th:classappend="${activeDanhMucId == 1} ? 'active' : ''">
                <span class="item-text"><i class="fa-solid fa-bowl-food me-2"></i>Phở Bắc & Khô</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>

            <a th:href="@{/danh-muc/2}" 
               class="sidebar-item"
               th:classappend="${activeDanhMucId == 2} ? 'active' : ''">
                <span class="item-text"><i class="fa-solid fa-utensils me-2"></i>Mì Tôm</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>

            <a th:href="@{/danh-muc/3}" 
               class="sidebar-item"
               th:classappend="${activeDanhMucId == 3} ? 'active' : ''">
                <span class="item-text"><i class="fa-solid fa-plate-wheat me-2"></i>Món Nui</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>

            <a th:href="@{/danh-muc/4}" 
               class="sidebar-item"
               th:classappend="${activeDanhMucId == 4} ? 'active' : ''">
                <span class="item-text"><i class="fa-solid fa-circle-plus me-2"></i>Các món khác</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>

            <a th:href="@{/danh-muc/5}" 
               class="sidebar-item"
               th:classappend="${activeDanhMucId == 5} ? 'active' : ''">
                <span class="item-text"><i class="fa-solid fa-bottle-water me-2"></i>Thức uống</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>

            <hr class="sidebar-divider">

            <a th:href="@{/lich-su-don-hang}" class="sidebar-item standard-link"
   th:classappend="${activePage == 'lich-su'} ? 'active' : ''">
    <span class="item-text"><i class="fa-solid fa-clock-rotate-left me-2"></i>Lịch sử đơn hàng</span>
    <i class="fa-solid fa-chevron-right item-arrow"></i>
</a>
        </div>

        <style>
            .phomuoi-sidebar {
			    background-color: #0093dd;
			    border-radius: 0;
			    overflow: hidden;
			    width: 100%;
			    min-height: 100%;   
			    font-family: 'Montserrat', sans-serif;
			}           

            .sidebar-header {
                background-color: #007bbd; 
                color: #ffffff;
                padding: 16px 20px;
                font-weight: 700;
                font-size: 15px;
                letter-spacing: 0.5px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                display: flex;
                align-items: center;
            }

            .sidebar-menu {
                padding: 10px 0;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .sidebar-item {
			    display: flex;
			    align-items: center;
			    justify-content: space-between;
			    padding: 14px 20px;
			    color: rgba(255, 255, 255, 0.9) !important;
			    text-decoration: none !important;
			    font-weight: 600;
			    font-size: 15px;
			    transition: all 0.2s ease-in-out;
			    border-left: 4px solid transparent;
			    width: 100%;             
			}

            .sidebar-item:hover {
                background-color: rgba(255, 255, 255, 0.15);
                color: #ffffff !important;
                padding-left: 24px; 
            }

            .sidebar-item.active {
                background-color: #ffffff;
                color: #0093dd !important;
                border-left: 4px solid #005684;
            }
            .sidebar-item.active .item-arrow {
                color: #0093dd;
            }

            .item-arrow {
                font-size: 11px;
                opacity: 0.7;
                transition: transform 0.2s;
            }
            .sidebar-item:hover .item-arrow {
                transform: translateX(3px);
                opacity: 1;
            }

            .sidebar-divider {
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                margin: 10px 20px;
            }

            .standard-link {
                font-size: 14px;
                opacity: 0.9;
            }
        </style>
    </div>

</body>
</html>
