<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <div th:fragment="sideBarMain" class="phomuoi-sidebar shadow-sm">
        
        <div class="sidebar-header">
            <i class="fa-solid fa-bars-staggered me-2"></i>
            <span>DANH MỤC MENU</span>
        </div>

        <div class="sidebar-menu">
            <a th:each="dm : ${dsDanhMuc}" 
               th:href="@{/danh-muc/{id}(id=${dm.id})}" 
               class="sidebar-item"
               th:classappend="${activeDanhMucId == dm.id} ? 'active' : ''">
                <span class="item-text" th:text="${dm.tenDanhMuc}">Tên Danh Mục</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>

            <div th:if="${#lists.isEmpty(dsDanhMuc)}" class="sidebar-empty text-muted">
                <i class="fa-solid fa-folder-open d-block mb-2 fs-4"></i>
                Chưa có danh mục nào
            </div>
            
            <hr class="sidebar-divider">

            <a th:href="@{/lich-su-don-hang}" class="sidebar-item standard-link">
                <span class="item-text"><i class="fa-solid fa-clock-rotate-left me-2"></i>Lịch sử đơn hàng</span>
                <i class="fa-solid fa-chevron-right item-arrow"></i>
            </a>
        </div>

        <style>
            .phomuoi-sidebar {
			    background-color: #0093dd;
			    border-radius: 0;
			    overflow: hidden;
			    width: 100%;
			    min-height: 100%;   /* ← kéo dài full chiều cao vùng nội dung */
			    font-family: 'Montserrat', sans-serif;
			}           /* ← THÊM để kéo dài hết cột */

            .sidebar-header {
                background-color: #007bbd; /* Màu tối hơn một chút tạo điểm nhấn */
                color: #ffffff;
                padding: 16px 20px;
                font-weight: 700;
                font-size: 15px;
                letter-spacing: 0.5px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.1);
                display: flex;
                align-items: center;
            }

            .sidebar-menu {
                padding: 10px 0;
                display: flex;
                flex-direction: column;
                gap: 2px;
            }

            .sidebar-item {
			    display: flex;
			    align-items: center;
			    justify-content: space-between;
			    padding: 14px 20px;
			    color: rgba(255, 255, 255, 0.9) !important;
			    text-decoration: none !important;
			    font-weight: 600;
			    font-size: 15px;
			    transition: all 0.2s ease-in-out;
			    border-left: 4px solid transparent;
			    width: 100%;             /* ← THÊM để item chiếm full chiều ngang */
}

            /* Hiệu ứng khi rê chuột qua (Hover) */
            .sidebar-item:hover {
                background-color: rgba(255, 255, 255, 0.15);
                color: #ffffff !important;
                padding-left: 24px; /* Chữ dịch chuyển nhẹ sang phải tinh tế */
            }

            /* Trạng thái khi mục đó đang được chọn (Active) */
            .sidebar-item.active {
                background-color: #ffffff;
                color: #0093dd !important;
                border-left: 4px solid #005684;
            }
            .sidebar-item.active .item-arrow {
                color: #0093dd;
            }

            .item-arrow {
                font-size: 11px;
                opacity: 0.7;
                transition: transform 0.2s;
            }
            .sidebar-item:hover .item-arrow {
                transform: translateX(3px);
                opacity: 1;
            }

            .sidebar-divider {
                border-top: 1px solid rgba(255, 255, 255, 0.2);
                margin: 10px 20px;
            }

            .standard-link {
                font-size: 14px;
                opacity: 0.9;
            }

            .sidebar-empty {
                padding: 30px 20px;
                text-align: center;
                color: rgba(255, 255, 255, 0.6) !important;
                font-size: 13px;
            }
        </style>
    </div>

</body>
</html>
