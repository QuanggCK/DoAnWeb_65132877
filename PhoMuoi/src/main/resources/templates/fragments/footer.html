<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>PhoMuoi Footer Component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .phomuoi-footer {
            background-color: #000000; /* Nền đen chuẩn như hình */
            color: #FFFFFF;            /* Chữ trắng */
            font-family: 'Montserrat', sans-serif;
            padding: 35px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-top: 1px solid #111111;
        }

        .footer-left {
            font-size: 15px;
            font-weight: 600;          /* In đậm tên tác giả vừa phải */
            letter-spacing: 0.3px;
        }

        .footer-right {
            display: flex;
            flex-direction: column;
            gap: 14px;                 /* Khoảng cách giữa dòng Facebook và Youtube */
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;     /* Bỏ gạch chân link */
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .footer-item:hover {
            opacity: 0.8;              /* Hiệu ứng mờ nhẹ khi hover */
        }

        .footer-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        /* Tối ưu hiển thị responsive mượt mà trên Điện thoại */
        @media (max-width: 768px) {
            .phomuoi-footer {
                flex-direction: column;
                text-align: center;
                gap: 22px;
                padding: 30px 20px;
            }
            .footer-right {
                align-items: center;
            }
        }
    </style>
</head>
<body>

    <footer class="phomuoi-footer" th:fragment="footerMain">
        
        <div class="footer-left">
            Developed by Phạm Minh Quang - QuanggcK
        </div>
        
        <div class="footer-right">
            
            <a href="https://www.facebook.com/pham.minh.quang.670165" target="_blank" class="footer-item">
                <span class="footer-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#1877F2">
                        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                    </svg>
                </span>
                <span>pham.minh.quang.670165</span>
            </a>

            <a href="https://www.youtube.com/@quanggck7908" target="_blank" class="footer-item">
                <span class="footer-icon">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="#FF0000">
                        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
                    </svg>
                </span>
                <span>https://www.youtube.com/@quanggck7908</span>
            </a>
            
        </div>
    </footer>

</body>
</html>
