<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    <nav th:fragment="header" class="navbar navbar-expand-lg navbar-dark py-2" style="background-color: #121ba6;">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            
            <a class="navbar-brand text-white fw-bold fs-4 pe-3" th:href="@{/}">PhoMuoi</a>

            <form class="d-flex mx-auto align-items-center" style="flex: 1; max-width: 550px;" th:action="@{/search}" method="GET">
                <input class="form-control border-0 px-4 py-2 w-100 text-dark" 
                       type="search" 
                       name="keyword"
                       placeholder="Tìm kiếm món ăn..." 
                       style="background-color: #d9d9d9; border-radius: 50px; font-size: 0.95rem; height: 42px;">
            </form>

            <div class="d-flex align-items-center gap-4 ps-3">
                
                <div class="dropdown">
                    <a class="text-white text-decoration-none dropdown-toggle fs-5 bg-transparent border-0" 
                       href="#" role="button" id="dropdownMenuDanhMuc" data-bs-toggle="dropdown" aria-expanded="false">
                        Danh mục
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2" aria-labelledby="dropdownMenuDanhMuc">
                        <li th:each="dm : ${dsDanhMuc}">
                            <a class="dropdown-item py-2" 
                               th:href="@{/danh-muc/{id}(id=${dm.id})}" 
                               th:text="${dm.tenDanhMuc}">Tên Danh Mục</a>
                        </li>
                        <li th:if="${#lists.isEmpty(dsDanhMuc)}">
                            <a class="dropdown-item disabled" href="#">Chưa có danh mục</a>
                        </li>
                    </ul>
                </div>

                <a th:href="@{/login}" class="text-white d-flex align-items-center justify-content-center text-decoration-none">
                    <i class="bi bi-person-circle" style="font-size: 2rem; line-height: 1;"></i>
                </a>

                <a th:href="@{/gio-hang}" class="btn border-0 d-flex align-items-center px-4 fw-normal text-dark shadow-sm" 
                   style="background-color: #d9d9d9; border-radius: 50px; height: 42px; gap: 8px; font-size: 0.95rem;">
                    <i class="bi bi-cart3 fs-5"></i>
                    <span>Giỏ hàng</span>
                </a>

            </div>
        </div>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
