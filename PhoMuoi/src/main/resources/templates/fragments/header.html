<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Header PhoMuoi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        .no-caret::after { display: none !important; }
        .nav-hover:hover { opacity: 0.8; transition: 0.2s; }
    </style>
</head>
<body>

    <nav th:fragment="header" class="navbar navbar-expand-lg py-2 shadow-sm" style="background-color: #121ba6;">
        <div class="container-fluid px-4 d-flex align-items-center justify-content-between">
            
            <a class="navbar-brand text-white fw-bold fs-4 pe-3 nav-hover" th:href="@{/}">PhoMuoi</a>

            <form class="d-flex mx-auto align-items-center" style="flex: 1; max-width: 550px;" th:action="@{/search}" method="GET">
                <input class="form-control border-0 px-4 py-2 w-100 text-dark" 
                       type="search" 
                       name="keyword"
                       placeholder="Tìm kiếm món ăn..." 
                       style="background-color: #e9ecef; border-radius: 50px; font-size: 0.95rem; height: 42px;">
            </form>

            <div class="d-flex align-items-center gap-4 ps-4">
                
                <a class="text-white text-decoration-none fs-6 d-flex align-items-center gap-2 nav-hover fw-semibold" 
                   th:href="@{/quang-cao}">
                    Quảng cáo
                    <i class="bi bi-megaphone-fill" style="font-size: 0.95rem;"></i>
                </a>

                <a th:href="${session.user != null} ? @{/tai-khoan} : @{/login}" 
                   class="text-white d-flex align-items-center justify-content-center text-decoration-none nav-hover">
                    <i class="bi bi-person" style="font-size: 2rem; line-height: 1; -webkit-text-stroke: 1px;"></i>
                </a>

                <a th:href="@{/gio-hang}" 
   th:data-logged="${session.userLogin != null}"
   th:data-cart-size="${session.cartSize != null ? session.cartSize : 0}"
   onclick="handleCartClick(this, event)"
   class="btn border-0 d-flex align-items-center px-4 fw-medium shadow-sm nav-hover" 
   
   th:classappend="${session.cartSize != null and session.cartSize > 0} ? 'text-white' : 'text-dark'"
   
   th:style="${session.cartSize != null and session.cartSize > 0} ? 
             'background-color: #F97316; border-radius: 50px; height: 42px; gap: 8px; font-size: 0.95rem; transition: 0.3s;' : 
             'background-color: #d9d9d9; border-radius: 50px; height: 42px; gap: 8px; font-size: 0.95rem; transition: 0.3s;'">
    
    <i class="bi bi-cart3 fs-5"></i>
    <span>Giỏ hàng</span>
    
    <span th:if="${session.cartSize != null and session.cartSize > 0}" 
          class="badge bg-white text-danger ms-1 rounded-pill shadow-sm"
          th:text="${session.cartSize}">
        1
    </span>
</a>

            </div>
        </div>
        
        <script>
            function handleCartClick(element, event) {
                const isLogged = element.getAttribute('data-logged') === 'true';
                const cartSize = parseInt(element.getAttribute('data-cart-size')) || 0;

                if (!isLogged) {
                    event.preventDefault();
                    alert("Bạn chưa đăng nhập! Vui lòng đăng nhập để xem giỏ hàng.");
                    window.location.href = "/";
                } 
                else if (cartSize === 0) {
                    event.preventDefault();
                    alert("Giỏ hàng của bạn đang trống! Hãy chọn món ăn trước nhé.");
                    window.location.href = "/";
                }
            }
        </script>
    </nav>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
