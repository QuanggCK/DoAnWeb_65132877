<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<body>

<!--/* ============================================================
     FOOTER ADMIN — Thymeleaf Fragment
     Dùng trong adminPage.html:
       <div th:replace="~{fragments/footerAdmin :: footerAdmin}"></div>
     ============================================================ */-->

<footer th:fragment="footerAdmin" class="footer-admin">

  <!-- Cột trái: thương hiệu + bản quyền -->
  <div class="footer-admin__left">
    <span class="footer-admin__brand">ADMIN</span>
    <span class="footer-admin__copy">
      &copy; 2025 Hệ thống quản trị nội bộ. Mọi quyền được bảo lưu.
    </span>
  </div>

  <!-- Cột giữa: điều hướng nhanh -->
  <nav class="footer-admin__nav">
    <a onclick="showPage('dashboard')">Dashboard</a>
    <a onclick="showPage('don-hang')">Đơn Hàng</a>
    <a onclick="showPage('doanh-thu')">Doanh Thu</a>
    <a onclick="showPage('users')">Khách Hàng</a>
  </nav>

  <!-- Cột phải: trạng thái hệ thống -->
  <div class="footer-admin__right">
    <span class="footer-admin__dot"></span>
    Hệ thống đang hoạt động
    <span class="footer-admin__sep">&middot;</span>
    API: <code>/api/admin</code>
  </div>

</footer>

</body>
</html>
