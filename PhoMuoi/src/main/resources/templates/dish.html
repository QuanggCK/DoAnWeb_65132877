<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Món Ăn - PhoMuoi</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .navbar { flex-shrink: 0 !important; }
        .phomuoi-footer { flex-shrink: 0 !important; }

        .content-wrapper {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .sidebar-col {
            width: 220px;
            flex-shrink: 0;
        }

        .main-col {
            flex-grow: 1;
            padding: 30px 25px;
        }

        /* --- CARD MÓN ĂN --- */
        .dish-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            transition: transform 0.25s, box-shadow 0.25s;
            height: 100%;
            display: flex;
            flex-direction: column;
        }

        .dish-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .dish-img-wrapper {
            width: 100%;
            height: 200px;
            overflow: hidden;
            background-color: #e9ecef;
        }

        .dish-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .dish-card:hover .dish-img-wrapper img {
            transform: scale(1.05);
        }

        .dish-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .dish-name {
            font-size: 16px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 6px;
            text-align: center;
        }

        .dish-price {
            font-size: 17px;
            font-weight: 700;
            color: #ef4444;
            text-align: center;
            margin-bottom: 16px;
        }

        .dish-actions {
            display: flex;
            gap: 8px;
            margin-top: auto;
        }

        .btn-detail {
            flex: 1;
            padding: 9px 0;
            border-radius: 8px;
            border: 1.5px solid #121ba6;
            background: white;
            color: #121ba6;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            transition: 0.2s;
            text-align: center;
            text-decoration: none;
        }

        .btn-detail:hover {
            background: #121ba6;
            color: white;
        }

        .btn-cart {
            flex: 1;
            padding: 9px 0;
            border-radius: 8px;
            border: none;
            background: #f97316;
            color: white;
            font-weight: 600;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            transition: 0.2s;
            cursor: pointer;
        }

        .btn-cart:hover {
            background: #ea6c0a;
            transform: translateY(-1px);
        }

        /* Tiêu đề trang */
        .page-title {
            font-size: 22px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e9ecef;
        }

        /* Trống rỗng */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: #adb5bd;
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 16px;
        }

        .empty-state p {
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="content-wrapper">

        <!-- SIDEBAR -->
        <div class="sidebar-col">
            <div th:replace="~{fragments/side-bar :: sideBarMain}"></div>
        </div>

        <!-- NỘI DUNG CHÍNH -->
        <main class="main-col">
            <h2 class="page-title">
                <i class="fa-solid fa-bowl-food me-2"></i> Món Ăn
            </h2>

            <!-- Danh sách món ăn -->
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-4 g-4"
                 th:if="${dsMonAn != null and not #lists.isEmpty(dsMonAn)}">

                <div class="col" th:each="mon : ${dsMonAn}">
                    <div class="dish-card">

                        <!-- Ảnh món ăn -->
                        <div class="dish-img">
						    <img th:if="${mon.hinhAnh != null and mon.hinhAnh != ''}"
					         th:src="@{/images/food-img/{h}(h=${mon.hinhAnh})}"
					         th:alt="${mon.tenMon}">
					         
					    <img th:if="${mon.hinhAnh == null or mon.hinhAnh == ''}"
					         th:src="@{/images/profiles/dish.png}"
					         alt="Ảnh mặc định">
						</div>

                        <div class="dish-body">
                            <div class="dish-name" th:text="${mon.tenMonAn}">Tên món</div>
                            <div class="dish-price"
                                 th:text="${#numbers.formatDecimal(mon.gia, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                0 đ
                            </div>

                            <div class="dish-actions">
                                <a th:href="@{/mon-an/{id}(id=${mon.id})}" class="btn-detail">
                                    <i class="fa-solid fa-eye me-1"></i> Chi tiết
                                </a>
                                <form th:action="@{/gio-hang/them}" method="POST" class="d-inline m-0">
    <input type="hidden" name="monAnId" th:value="${mon.id}">
    <input type="hidden" name="soLuong" value="1">
    
    <button type="submit" class="btn-cart" style="border: none;">
        <i class="fa-solid fa-cart-shopping me-1"></i> Thêm
    </button>
</form>
                            </div>
                        </div>

                    </div>
                </div>

            </div>

            <!-- Trạng thái trống -->
            <div class="empty-state" th:if="${dsMonAn == null or #lists.isEmpty(dsMonAn)}">
                <i class="fa-solid fa-plate-wheat"></i>
                <p>Chưa có món ăn nào để hiển thị.</p>
            </div>

        </main>
    </div>

    <div th:replace="~{fragments/footer :: footerMain}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
