<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Cá Nhân - PhoMuoi</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url('/images/bg/quan.jpg');
		    background-size: cover;
		    background-position: center;
		    background-attachment: fixed;
		    background-repeat: no-repeat;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        /* CỐ ĐỊNH CHIỀU CAO HEADER: Không cho phép Flexbox bóp nghẹt */
        .navbar {
            flex-shrink: 0 !important;
        }

        /* CỐ ĐỊNH CHIỀU CAO FOOTER: Không cho phép Flexbox bóp nghẹt */
        .phomuoi-footer {
            flex-shrink: 0 !important;
        }

        .main-container {
            flex: 1 0 auto; /* Giúp giãn phần thân và không bị co rụt */
            max-width: 1200px; /* ĐÃ TĂNG lên để vừa vặn khi chứa thêm Sidebar */
            width: 100%;
            margin: 50px auto;
            padding: 0 15px;
        }

        /* --- PROFILE CARD STYLING --- */
        .profile-card {
            background: rgba(255, 255, 255, 0.92);
    		backdrop-filter: blur(6px);
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 40px; /* Giảm nhẹ padding để text không bị kích khi chia cột */
            text-align: center;
        }

        .profile-title {
            font-size: 26px;
            font-weight: 700;
            color: #1a237e;
            margin-bottom: 40px;
            text-transform: uppercase;
        }

        .profile-body {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 40px; /* Giảm khoảng cách gap một chút cho vừa vặn */
            margin-bottom: 40px;
        }

        /* Avatar */
        .avatar-circle {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            background: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 70px;
            color: #adb5bd;
            border: 5px solid #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* Thông tin */
        .info-list {
            text-align: left;
            flex: 1;
            max-width: 400px;
        }

        .info-item {
            margin-bottom: 20px;
            border-bottom: 1px solid #f1f1f1;
            padding-bottom: 10px;
        }

        .info-label {
            display: block;
            font-size: 13px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
        }

        .info-value {
            font-size: 17px;
            color: #333;
            font-weight: 500;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            margin-top: 5px;
        }
        .badge-admin { background: #fee2e2; color: #ef4444; }
        .badge-user { background: #dcfce7; color: #22c55e; }

        /* Nút bấm */
        .btn-group-custom {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-update {
            background-color: #121ba6; 
            color: white;
            padding: 12px 30px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-update:hover {
            background-color: #0d1480;
            transform: translateY(-2px);
        }

        .btn-logout {
            background-color: white;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.3s;
        }

        .btn-logout:hover {
            background-color: #fef2f2;
        }

        /* Hỗ trợ Responsive mượt mà trên Mobile nếu giao diện profile bị co */
        @media (max-width: 576px) {
            .profile-body {
                flex-direction: column;
                gap: 20px;
            }
            .info-list {
                max-width: 100%;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main style="flex:1; display:flex; align-items:center; justify-content:center; padding:40px 15px;">
    <div style="width:100%; max-width:700px;">
        <div class="profile-card">
            <h1 class="profile-title">Trang Cá Nhân</h1>

            <div class="profile-body">
                <div class="avatar-section">
                    <div class="avatar-circle" th:if="${user.anh != null and user.anh != ''}">
                        <img th:src="@{/images/profiles/{anh}(anh=${user.anh})}" 
                             alt="Avatar"
                             style="width:100%; height:100%; border-radius:50%; object-fit:cover;">
                    </div>
                    
                </div>

                <div class="info-list">
                    <div class="info-item">
                        <span class="info-label">Họ và Tên</span>
                        <span class="info-value" th:text="${user?.tenKhach}">Tên người dùng</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Số điện thoại</span>
                        <span class="info-value" th:text="${user.sdt}">0123 456 789</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Địa chỉ</span>
                        <span class="info-value" th:text="${user.diaChi}">Địa chỉ mặc định</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">Cấp bậc</span>
                        <span th:if="${user.roleAdmin == true}" class="role-badge badge-admin">QUẢN TRỊ VIÊN</span>
                        <span th:if="${user.roleAdmin != true}" class="role-badge badge-user">KHÁCH HÀNG</span>
                    </div>
                </div>
            </div>

            <div class="btn-group-custom mt-4">
                <a th:href="@{/tai-khoan/update}" class="btn-update text-decoration-none text-white d-inline-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-user-pen me-2"></i> Cập nhật thông tin
                </a>
                <a th:href="@{/logout}" class="btn-logout text-decoration-none d-inline-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-right-from-bracket me-2"></i> Đăng xuất
                </a>
            </div>
        </div>
    </div>
</main>

    <div th:replace="~{fragments/footer :: footerMain}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
