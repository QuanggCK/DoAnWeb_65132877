<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - PhoMuoi</title>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        .content-wrapper {
            flex-grow: 1;
            padding: 40px 0;
        }

        /* Styling cho Card lớn */
        .cart-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            background-color: #ffffff;
            overflow: hidden;
        }

        .cart-header-title {
            color: #121ba6;
            font-weight: 700;
            position: relative;
            padding-bottom: 10px;
        }

        .cart-header-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: 0;
            width: 60px;
            height: 4px;
            background-color: #F97316;
            border-radius: 2px;
        }

        /* Bảng sản phẩm */
        .table-cart thead {
            background-color: #f8f9fa;
        }

        .table-cart th {
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
            padding: 15px;
        }

        .table-cart td {
            padding: 20px 15px;
            vertical-align: middle;
        }

        .product-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .product-name {
            font-weight: 600;
            color: #212529;
            margin-bottom: 4px;
            font-size: 1.05rem;
        }

        .product-price {
            color: #F97316;
            font-weight: 600;
        }

        /* Sidebar tóm tắt đơn hàng */
        .summary-box {
            background-color: #f8f9fa;
            border-radius: 14px;
            padding: 25px;
            border: 1px solid #edf2f7;
        }

        .summary-title {
            font-weight: 700;
            color: #121ba6;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: #6c757d;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px dashed #dee2e6;
            font-size: 1.25rem;
            font-weight: 700;
            color: #212529;
        }

        .total-price {
            color: #F97316;
        }

        /* Form Controls */
        .form-custom .form-control {
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #ced4da;
            font-size: 0.95rem;
            transition: all 0.3s;
        }

        .form-custom .form-control:focus {
            border-color: #121ba6;
            box-shadow: 0 0 0 0.25rem rgba(18, 27, 166, 0.15);
        }

        /* Buttons */
        .btn-checkout {
            background-color: #F97316;
            color: white;
            font-weight: 600;
            padding: 14px;
            border-radius: 50px;
            border: none;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(249, 115, 22, 0.3);
        }

        .btn-checkout:hover {
            background-color: #e05e07;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(249, 115, 22, 0.4);
            color: white;
        }

        .btn-return-shop {
            background-color: transparent;
            color: #121ba6;
            border: 2px solid #121ba6;
            font-weight: 600;
            padding: 10px 24px;
            border-radius: 50px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-return-shop:hover {
            background-color: #121ba6;
            color: white;
        }

        /* Trạng thái giỏ hàng trống */
        .empty-cart-box {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart-icon {
            font-size: 5rem;
            color: #cbd5e1;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div th:replace="~{fragments/header :: header}"></div>

    <main class="content-wrapper">
        <div class="container">
            
            <div th:if="${donHang != null and !#lists.isEmpty(donHang.dsChiTietDonHang)}" class="row g-4">
                
                <div class="col-lg-8">
                    <div class="card cart-card p-4">
                        <h4 class="cart-header-title mb-4">Món ăn đã chọn</h4>
                        
                        <div class="table-responsive">
                            <table class="table table-cart align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col" style="width: 100px;">Hình ảnh</th>
                                        <th scope="col">Món ăn</th>
                                        <th scope="col" class="text-center">Số lượng</th>
                                        <th scope="col" class="text-end">Đơn giá</th>
                                        <th scope="col" class="text-end">Tổng</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="ct : ${donHang.dsChiTietDonHang}">
                                        <td>
                                            <img th:src="${ct.monAn.hinhAnh != null and ct.monAn.hinhAnh != '' ? ct.monAn.hinhAnh : 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=200'}" 
                                                 class="product-img" alt="Hình ảnh món ăn">
                                        </td>
                                        <td>
                                            <div class="product-name" th:text="${ct.monAn.tenMonAn}">Tên món ăn</div>
                                            <small class="text-muted" th:text="'Mã món: #' + ${ct.monAn.id}">#1</small>
                                        </td>
                                        <td class="text-center fw-semibold fs-5" style="color: #495057;" th:text="${ct.quantity}">
                                            1
                                        </td>
                                        <td class="text-end product-price" 
                                            th:text="${#numbers.formatDecimal(ct.gia, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                            0 đ
                                        </td>
                                        <td class="text-end fw-bold text-dark" 
                                            th:text="${#numbers.formatDecimal(ct.gia * ct.quantity, 0, 'COMMA', 0, 'POINT')} + ' đ'">
                                            0 đ
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="mt-3">
                            <a th:href="@{/}" class="btn btn-return-shop">
                                <i class="fa-solid fa-arrow-left me-2"></i> Tiếp tục chọn món
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card cart-card p-4">
                        <h4 class="cart-header-title mb-4">Thông tin đặt hàng</h4>
                        
                        <form th:action="@{/dat-hang}" th:object="${donHang}" method="POST" class="form-custom">
                            
                            <div class="mb-3">
                                <label for="soDienThoaiNhan" class="form-label fw-medium text-secondary">Số điện thoại nhận hàng <span class="text-danger">*</span></label>
                                <input type="tel" class="form-control" id="soDienThoaiNhan" th:field="*{soDienThoaiNhan}" required placeholder="Nhập số điện thoại nhận...">
                            </div>

                            <div class="mb-4">
                                <label for="ghiChu" class="form-label fw-medium text-secondary">Địa chỉ giao hàng & Ghi chú</label>
                                <textarea class="form-control" id="ghiChu" th:field="*{ghiChu}" rows="3" placeholder="Nhập số nhà, tên đường, ghi chú tài xế..."></textarea>
                            </div>

                            <div class="summary-box mb-4">
                                <div class="summary-title">Tóm tắt chi phí</div>
                                <div class="summary-row">
                                    <span>Tạm tính</span>
                                    <span class="fw-medium text-dark" th:text="${#numbers.formatDecimal(donHang.tongGia, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                                </div>
                                <div class="summary-row">
                                    <span>Phí giao hàng</span>
                                    <span class="text-success fw-medium">Miễn phí</span>
                                </div>
                                <div class="summary-total">
                                    <span>Tổng thanh toán</span>
                                    <span class="total-price" th:text="${#numbers.formatDecimal(donHang.tongGia, 0, 'COMMA', 0, 'POINT')} + ' đ'">0 đ</span>
                                </div>
                            </div>

                            <button type="submit" class="btn-checkout btn">
                                <i class="fa-solid fa-circle-check me-2"></i> XÁC NHẬN ĐẶT HÀNG
                            </button>
                        </form>
                    </div>
                </div>

            </div>

            <div th:if="${donHang == null or #lists.isEmpty(donHang.dsChiTietDonHang)}" class="card cart-card">
                <div class="empty-cart-box">
                    <i class="fa-solid fa-basket-shopping empty-cart-icon"></i>
                    <h3 class="fw-bold text-secondary mb-2">Giỏ hàng của bạn đang trống</h3>
                    <p class="text-muted mb-4">Bạn chưa thêm món ăn nào vào giỏ hàng của mình.</p>
                    <a th:href="@{/}" class="btn btn-checkout px-5 py-2" style="max-width: 280px; display: inline-block;">
                        <i class="fa-solid fa-utensils me-2"></i> Khám phá menu ngay
                    </a>
                </div>
            </div>

        </div>
    </main>

    <div th:replace="~{fragments/footer :: footerMain}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script th:inline="javascript">
    /*<![CDATA[*/
    
    var errorMsg = /*[[${errorMessage}]]*/ null;
    var successMsg = /*[[${successMessage}]]*/ null;

    if (errorMsg) {
        alert(errorMsg);
    }
    if (successMsg) {
        alert(successMsg);
    }
    
    /*]]>*/
</script>
</body>
</html>
