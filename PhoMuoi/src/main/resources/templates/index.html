<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang chủ PhoMuoi</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Áp dụng font Montserrat cho trang chủ */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #F9FAFB; /* Nền xám siêu nhạt cao cấp */
            color: #374151;
        }
        
        .no-caret::after {
            display: none !important;
        }
        
        .nav-hover:hover {
            opacity: 0.8;
            transition: 0.2s;
        }

        .text-brand-primary {
            color: #1B1AB1 !important;
        }

        /* ---------------------------------------------------- */
        /* ĐƯA CSS FOOTER VÀO ĐÂY ĐỂ TRANG CHỦ ĐỌC ĐƯỢC ĐỊNH DẠNG */
        /* ---------------------------------------------------- */
        .phomuoi-footer {
            background-color: #000000; /* Nền đen chuẩn */
            color: #FFFFFF;            /* Chữ trắng */
            padding: 35px 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            border-top: 1px solid #111111;
        }

        .footer-left {
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .footer-right {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: #FFFFFF;
            font-size: 14px;
            font-weight: 500;
            transition: opacity 0.2s ease;
        }

        .footer-item:hover {
            opacity: 0.8;
        }

        .footer-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
        }

        /* Tối ưu responsive mượt mà trên Điện thoại */
        @media (max-width: 768px) {
            .phomuoi-footer {
                flex-direction: column;
                text-align: center;
                gap: 22px;
                padding: 30px 20px;
            }
            .footer-right {
                align-items: center;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: header}"></div>

    <div class="container mt-5 mb-5 flex-grow-1">
        <h1 class="text-center text-brand-primary fw-bold">Chào mừng bạn đến với Phở Muội!</h1>
        <p class="text-center mt-3 text-muted">Thanh header và footer đã được nhúng thành công bằng Thymeleaf Fragment.</p>
    </div>

    <div th:replace="~{fragments/footer :: footerMain}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
