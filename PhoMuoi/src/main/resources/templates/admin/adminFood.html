<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Quản Lý Món Ăn – Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<style>
  :root{
    --bg:#0d0d0d;--surface:#161616;--border:#2a2a2a;
    --accent:#ff5c00;--accent2:#ffb800;--text:#f0ece4;
    --muted:#6b6b6b;--success:#22c55e;--danger:#ef4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;}

  /* ── SIDEBAR ── */
  .sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;height:100vh;z-index:10;}
  .sidebar-logo{padding:30px 24px;border-bottom:1px solid var(--border);}
  .sidebar-logo .brand{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1.5px;color:var(--accent);line-height:1;}
  .sidebar-logo .sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:4px;}
  .nav{padding:24px 16px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .nav-section{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:16px 8px 8px 8px;font-weight:600;}
  .nav-section:first-child{padding-top:0;}
  .nav-item{display:flex;align-items:center;gap:12px;padding:12px 14px;color:var(--text);text-decoration:none;border-radius:8px;font-size:14px;font-weight:500;transition:all .2s;}
  .nav-item .icon{width:20px;display:flex;justify-content:center;color:var(--muted);font-size:16px;transition:color .2s;}
  .nav-item:hover{background:#1e1e1e;color:#fff;}
  .nav-item:hover .icon{color:var(--text);}
  .nav-item.active{background:linear-gradient(135deg,#ff5c00 0%,#ff3d00 100%);color:#fff;font-weight:600;box-shadow:0 4px 12px rgba(255,92,0,.2);}
  .nav-item.active .icon{color:#fff;}
  .sidebar-footer{padding:20px 24px;border-top:1px solid var(--border);}
  .btn-logout{display:flex;align-items:center;gap:10px;color:var(--danger);text-decoration:none;font-size:14px;font-weight:500;transition:opacity .2s;}
  .btn-logout:hover{opacity:.8;}

  /* ── MAIN CONTENT ── */
  .main-content{margin-left:240px;padding:40px;width:calc(100% - 240px);display:flex;flex-direction:column;min-height:100vh;}
  .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px;}
  .header h1{font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:1px;}
  .header p{color:var(--muted);font-size:14px;margin-top:4px;}

  /* BUTTONS */
  .btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;text-decoration:none;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:#e05200;box-shadow:0 4px 12px rgba(255,92,0,.2);}
  .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-secondary:hover{background:var(--border);color:#fff;}
  .btn-danger{background:rgba(239,68,68,.1);color:var(--danger);border:1px solid rgba(239,68,68,.2);}
  .btn-danger:hover{background:var(--danger);color:#fff;}
  .btn-icon{width:32px;height:32px;padding:0;justify-content:center;border-radius:6px;font-size:14px;}

  /* ACTIONS ROW */
  .actions-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);padding:16px 24px;border-radius:12px;margin-bottom:24px;}
  .search-box{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--border);padding:10px 16px;border-radius:8px;width:320px;}
  .search-box i{color:var(--muted);font-size:14px;}
  .search-box input{background:transparent;border:none;color:var(--text);font-size:14px;outline:none;width:100%;}
  .search-box input::placeholder{color:var(--muted);}
  .filter-group{display:flex;align-items:center;gap:12px;}
  .select-custom{background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 16px;border-radius:8px;font-size:14px;outline:none;cursor:pointer;min-width:160px;}

  /* TABLE CARD */
  .card-table{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;flex:1;}
  table{width:100%;border-collapse:collapse;text-align:left;}
  th{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:16px 24px;border-bottom:1px solid var(--border);font-weight:600;background:rgba(0,0,0,.1);}
  td{padding:16px 24px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle;}
  tr:last-child td{border:none;}
  tr:hover td{background:rgba(255,255,255,.01);}

  .food-cell{display:flex;align-items:center;gap:16px;}
  .food-img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--bg);border:1px solid var(--border);}
  .food-info .name{font-weight:600;color:#fff;margin-bottom:2px;}
  .food-info .desc{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}

  .price-text{font-weight:600;color:var(--accent2);}
  .badge{display:inline-flex;padding:4px 8px;border-radius:6px;font-size:11px;font-weight:600;text-transform:uppercase;}
  .badge-success{background:rgba(34,197,94,.1);color:var(--success);}
  .badge-danger{background:rgba(239,68,68,.1);color:var(--danger);}
  .table-actions{display:flex;gap:8px;justify-content:flex-end;}

  /* MODAL */
  .modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:all .2s ease;}
  .modal.open{opacity:1;pointer-events:auto;}
  .modal-container{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:540px;max-width:95%;overflow:hidden;transform:translateY(20px);transition:all .2s ease;}
  .modal.open .modal-container{transform:translateY(0);}
  .modal-header{padding:24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-header h3{font-size:18px;font-weight:600;}
  .modal-close{background:transparent;border:none;color:var(--muted);font-size:20px;cursor:pointer;transition:color .2s;}
  .modal-close:hover{color:#fff;}
  .modal-body{padding:24px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto;}
  .form-group{display:flex;flex-direction:column;gap:8px;}
  .form-group label{font-size:13px;font-weight:500;color:var(--muted);}
  .form-control{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 14px;color:var(--text);font-size:14px;outline:none;transition:border-color .2s;width:100%;}
  .form-control:focus{border-color:var(--accent);}
  textarea.form-control{resize:none;height:80px;}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:12px;}

  /* TOAST */
  .toast-box{position:fixed;bottom:30px;right:30px;background:var(--surface);border:1px solid var(--border);padding:14px 24px;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.5);display:flex;align-items:center;gap:12px;z-index:200;transform:translateY(100px);opacity:0;transition:all .3s cubic-bezier(.68,-.55,.26,.55,1.55);}
  .toast-box.show{transform:translateY(0);opacity:1;}
  .toast-icon{font-size:16px;}
  .toast-success{border-left:4px solid var(--success);color:var(--success);}
  .toast-error{border-left:4px solid var(--danger);color:var(--danger);}
  .toast-text{color:var(--text);font-size:14px;font-weight:500;}
</style>
</head>
<body>

  <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin(activePage='mon-an')}">
    </div>

  <main class="main-content">
    <div class="header">
      <div>
        <h1>Quản Lý Thực Đơn</h1>
        <p>Quản lý danh sách món ăn, giá bán và trạng thái kinh doanh của cửa hàng</p>
      </div>
      <button class="btn btn-primary" onclick="openAddModal()">
        <i class="fa-solid fa-plus"></i> Thêm món ăn mới
      </button>
    </div>

    <div class="actions-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="search-input" placeholder="Tìm kiếm tên món ăn..." oninput="filterTable()"/>
      </div>
      <div class="filter-group">
        <select class="select-custom" id="filter-category" onchange="filterTable()">
          <option value="ALL">Tất cả danh mục</option>
        </select>
        <select class="select-custom" id="filter-status" onchange="filterTable()">
          <option value="ALL">Tất cả trạng thái</option>
          <option value="true">Đang bán</option>
          <option value="false">Ngừng kinh doanh</option>
        </select>
      </div>
    </div>

    <div class="card-table">
      <table>
        <thead>
          <tr>
            <th style="width: 80px;">ID</th>
            <th>Món ăn</th>
            <th style="width: 180px;">Danh mục</th>
            <th style="width: 150px;">Đơn giá</th>
            <th style="width: 180px;">Trạng thái</th>
            <th style="width: 120px; text-align: right;">Hành động</th>
          </tr>
        </thead>
        <tbody id="food-tbody">
          <tr>
            <td colspan="6" style="text-align: center; color: var(--muted); padding: 40px;">
              <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Đang tải dữ liệu thực đơn...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    </main>

  <div class="modal" id="modal-form">
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modal-title">Thêm Món Ăn Mới</h3>
        <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="f-id"/>
        <div class="form-group">
          <label>Tên món ăn <span style="color:var(--danger)">*</span></label>
          <input type="text" id="f-ten" class="form-control" placeholder="Ví dụ: Cơm rang dưa bò"/>
        </div>
        <div class="grid-2" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="form-group">
            <label>Đơn giá (VNĐ) <span style="color:var(--danger)">*</span></label>
            <input type="number" id="f-gia" class="form-control" placeholder="Giá tiền bán..."/>
          </div>
          <div class="form-group">
            <label>Danh mục <span style="color:var(--danger)">*</span></label>
            <select id="f-danhmuc" class="form-control"></select>
          </div>
        </div>
        <div class="form-group">
          <label>Đường dẫn hình ảnh (URL)</label>
          <input type="text" id="f-hinhanh" class="form-control" placeholder="https://example.com/image.jpg"/>
        </div>
        <div class="form-group">
          <label>Nguyên liệu / Mô tả</label>
          <textarea id="f-mota" class="form-control" placeholder="Thành phần, hương vị, định lượng..."></textarea>
        </div>
        <div class="form-group">
          <label>Trạng thái kinh doanh</label>
          <select id="f-trangthai" class="form-control">
            <option value="true">Mở bán trực tuyến</option>
            <option value="false">Tạm ngưng cung cấp</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">Hủy bỏ</button>
        <button class="btn btn-primary" onclick="saveData()">Lưu thông tin</button>
      </div>
    </div>
  </div>

  <div class="modal" id="confirm-del">
    <div class="modal-container" style="width: 400px;">
      <div class="modal-header" style="border:none; padding-bottom:0;">
        <h3>Xác nhận xóa món</h3>
        <button class="modal-close" onclick="closeConfirm()"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="modal-body" style="padding-top:12px;" id="confirm-msg">
        Bạn có chắc chắn muốn xóa món ăn này ra khỏi thực đơn hệ thống không?
      </div>
      <div class="modal-footer" style="border:none;">
        <button class="btn btn-secondary" onclick="closeConfirm()">Hủy</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Đồng ý xóa</button>
      </div>
    </div>
  </div>

  <div class="toast-box" id="toast">
    <div class="toast-icon" id="toast-icon"></div>
    <div class="toast-text" id="toast-text">Thông báo mặc định</div>
  </div>

  <script th:inline="javascript">
  /*<![CDATA[*/
    const API = '/api/admin';
    let allMonAn = [];
    let allDanhMuc = [];
    let deleteTargetId = null;

    const fmt = v => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v);

    function toast(msg, type = 'success') {
      const box = document.getElementById('toast');
      const text = document.getElementById('toast-text');
      const icon = document.getElementById('toast-icon');

      box.className = 'toast-box show';
      text.textContent = msg;

      if (type === 'success') {
        box.classList.add('toast-success');
        icon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
      } else {
        box.classList.add('toast-error');
        icon.innerHTML = '<i class="fa-solid fa-circle-exclamation"></i>';
      }
      setTimeout(() => box.classList.remove('show'), 3000);
    }

    async function apiFetch(endpoint, method = 'GET', body = null) {
      const options = { method, headers: { 'Content-Type': 'application/json' } };
      if (body) options.body = JSON.stringify(body);
      const res = await fetch(API + endpoint, options);
      if (!res.ok) throw new Error(await res.text());
      return res.status !== 204 ? await res.json() : null;
    }

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        // Fix: Chống sập trang (CATCH) để nếu API Danh Mục bị lỗi, trang Món Ăn vẫn lên dữ liệu bình thường
        const [foods, cats] = await Promise.all([
          apiFetch('/mon-an').catch(e => { console.error(e); return []; }),
          apiFetch('/danh-muc').catch(e => { console.error(e); return []; })
        ]);
        
        allMonAn = Array.isArray(foods) ? foods : [];
        allDanhMuc = Array.isArray(cats) ? cats : [];

        const fCat = document.getElementById('filter-category');
        const mCat = document.getElementById('f-danhmuc');
        
        const catOptions = allDanhMuc.map(c => `<option value="${c.id}">${c.tenDanhMuc || c.ten || 'DM'}</option>`).join('');
        fCat.innerHTML = '<option value="ALL">Tất cả danh mục</option>' + catOptions;
        mCat.innerHTML = catOptions;

        filterTable();
      } catch (e) {
        toast('Lỗi tải dữ liệu ban đầu: ' + e.message, 'error');
      }
    });

    function filterTable() {
      const search = document.getElementById('search-input').value.toLowerCase().trim();
      const catId = document.getElementById('filter-category').value;
      const status = document.getElementById('filter-status').value;

      const filtered = allMonAn.filter(m => {
        // Hỗ trợ cả 2 chuẩn tên API (tenMon và tenMonAn)
        const name = (m.tenMon || m.tenMonAn || '').toLowerCase();
        const matchSearch = name.includes(search);
        const matchCat = catId === 'ALL' || (m.danhMuc && m.danhMuc.id === parseInt(catId));
        const matchStatus = status === 'ALL' || String(m.trangThai) === status;
        return matchSearch && matchCat && matchStatus;
      });

      renderTable(filtered);
    }

    function renderTable(list) {
      const tbody = document.getElementById('food-tbody');
      if (!list.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--muted);padding:40px;">Không tìm thấy món ăn phù hợp hoặc chưa có dữ liệu</td></tr>`;
        return;
      }

      tbody.innerHTML = list.map(m => {
        // Mapping dữ liệu an toàn dựa theo Backend AdminController.java
        const tenMon = m.tenMon || m.tenMonAn || 'Chưa có tên';
        const nguyenLieu = m.nguyenLieu || m.moTa || 'Không có mô tả / nguyên liệu';
        const giaTien = m.giaTien || m.gia || 0;
        
        return `
        <tr>
          <td><b>#${m.id}</b></td>
          <td>
            <div class="food-cell">
              <img src="${m.hinhAnh || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'}" class="food-img" alt="food" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=100'">
              <div class="food-info">
                <div class="name">${tenMon}</div>
                <div class="desc">${nguyenLieu}</div>
              </div>
            </div>
          </td>
          <td><span style="color:var(--text);font-weight:500;">${m.danhMuc?.tenDanhMuc || m.danhMuc?.ten || 'Chưa phân loại'}</span></td>
          <td><span class="price-text">${fmt(giaTien)}</span></td>
          <td>
            <span class="badge ${m.trangThai ? 'badge-success' : 'badge-danger'}">
              ${m.trangThai ? 'Đang bán' : 'Ngừng kinh doanh'}
            </span>
          </td>
          <td>
            <div class="table-actions">
              <button class="btn btn-secondary btn-icon" onclick="openEditModal(${m.id})" title="Sửa"><i class="fa-solid fa-pen-to-square"></i></button>
              <button class="btn btn-danger btn-icon" onclick="askDelete(${m.id}, '${tenMon.replace(/'/g, "\\'")}')" title="Xóa"><i class="fa-solid fa-trash"></i></button>
            </div>
          </td>
        </tr>
      `}).join('');
    }

    function openAddModal() {
      document.getElementById('modal-title').textContent = 'Thêm Món Ăn Mới';
      document.getElementById('f-id').value = '';
      document.getElementById('f-ten').value = '';
      document.getElementById('f-gia').value = '';
      document.getElementById('f-hinhanh').value = '';
      document.getElementById('f-mota').value = '';
      document.getElementById('f-trangthai').value = 'true';
      if (allDanhMuc.length) document.getElementById('f-danhmuc').value = allDanhMuc[0].id;
      document.getElementById('modal-form').classList.add('open');
    }

    function openEditModal(id) {
      const m = allMonAn.find(x => x.id === id);
      if (!m) return;

      document.getElementById('modal-title').textContent = 'Cập Nhật Món Ăn';
      document.getElementById('f-id').value = m.id;
      document.getElementById('f-ten').value = m.tenMon || m.tenMonAn || '';
      document.getElementById('f-gia').value = m.giaTien || m.gia || '';
      document.getElementById('f-hinhanh').value = m.hinhAnh || '';
      document.getElementById('f-mota').value = m.nguyenLieu || m.moTa || '';
      document.getElementById('f-trangthai').value = String(m.trangThai);
      if (m.danhMuc) document.getElementById('f-danhmuc').value = m.danhMuc.id;

      document.getElementById('modal-form').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modal-form').classList.remove('open');
    }

    async function saveData() {
      const id = document.getElementById('f-id').value;
      const ten = document.getElementById('f-ten').value.trim();
      const gia = parseFloat(document.getElementById('f-gia').value);
      const catId = parseInt(document.getElementById('f-danhmuc').value);
      const hinhAnh = document.getElementById('f-hinhanh').value.trim();
      const moTa = document.getElementById('f-mota').value.trim();
      const trangThai = document.getElementById('f-trangthai').value === 'true';

      if (!ten || isNaN(gia) || isNaN(catId)) {
        toast('Vui lòng điền đầy đủ các thông tin bắt buộc (*)', 'error');
        return;
      }

      // Khai báo gộp cả tên thuộc tính cũ và mới để chắc chắn Backend Java không bị "bỏ đói" dữ liệu
      const bodyData = {
        tenMon: ten,
        tenMonAn: ten, 
        giaTien: gia,
        gia: gia,
        hinhAnh: hinhAnh || null,
        nguyenLieu: moTa || null,
        moTa: moTa || null,
        trangThai: trangThai,
        danhMuc: { id: catId }
      };

      try {
        if (id) {
          await apiFetch('/mon-an/' + id, 'PUT', bodyData);
          toast('Cập nhật món ăn thành công!');
        } else {
          await apiFetch('/mon-an', 'POST', bodyData);
          toast('Thêm món ăn mới thành công!');
        }
        closeModal();
        allMonAn = await apiFetch('/mon-an');
        filterTable();
      } catch (e) {
        toast('Lỗi: ' + e.message, 'error');
      }
    }

    function askDelete(id, name) {
      deleteTargetId = id;
      document.getElementById('confirm-msg').textContent = `Xoá món "${name}" khỏi thực đơn?`;
      document.getElementById('confirm-del').classList.add('open');
    }

    function closeConfirm() {
      deleteTargetId = null;
      document.getElementById('confirm-del').classList.remove('open');
    }

    async function confirmDelete() {
      if (!deleteTargetId) return;
      try {
        const res = await fetch(API + '/mon-an/' + deleteTargetId, { method: 'DELETE' });
        if (!res.ok) throw new Error(await res.text());
        toast('Đã xoá món ăn thành công!');
        closeConfirm();
        allMonAn = allMonAn.filter(m => m.id !== deleteTargetId);
        filterTable();
      } catch (e) {
        toast('Lỗi xoá: ' + e.message, 'error');
      }
    }

    document.getElementById('modal-form').addEventListener('click', e => {
      if (e.target.id === 'modal-form') closeModal();
