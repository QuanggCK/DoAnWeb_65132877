<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Khách Hàng – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #ff5c00;
      --accent2: #ffb800;
      --text: #f0ece4;
      --muted: #6b6b6b;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; }

    /* ==========================================
       ── BỘ CSS ĐỒNG BỘ VỚI SIDEBAR FRAGMENT
       ========================================== */
    .sidebar { width: 240px; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; height: 100vh; z-index: 100; top: 0; left: 0; }
    .sidebar-logo { padding: 30px 24px; border-bottom: 1px solid var(--border); }
    .sidebar-logo .brand { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 1.5px; color: var(--accent); line-height: 1; }
    .sidebar-logo .sub { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-top: 4px; }
    .nav { padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; flex: 1; overflow-y: auto; }
    .nav-section { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); padding: 16px 8px 8px 8px; font-weight: 600; }
    .nav-section:first-child { padding-top: 0; }
    .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 14px; color: var(--text); text-decoration: none; border-radius: 8px; font-size: 14px; font-weight: 500; transition: all 0.2s ease; }
    .nav-item .icon { width: 20px; display: flex; justify-content: center; color: var(--muted); font-size: 16px; transition: color 0.2s ease; }
    .nav-item:hover { background: #1e1e1e; color: #fff; }
    .nav-item:hover .icon { color: var(--text); }
    .nav-item.active { background: linear-gradient(135deg, #ff5c00 0%, #ff3d00 100%); color: #fff; font-weight: 600; box-shadow: 0 4px 12px rgba(255, 92, 0, 0.2); }
    .nav-item.active .icon { color: #fff; }
    .sidebar-footer { padding: 20px 24px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); display: flex; align-items: center; }

    /* ==========================================
       ── MAIN LAYOUT & CONTENT
       ========================================== */
    .main { margin-left: 240px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }
    .topbar { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 1px; }
    .admin-badge { background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; }
    
    .content { padding: 32px; flex: 1; }
    .page-header { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; }
    .page-heading { font-family: 'Bebas Neue', sans-serif; font-size: 32px; letter-spacing: 1px; }
    .page-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }

    /* FILTER TOOLBAR */
    .tool-bar { display: flex; gap: 12px; margin-bottom: 24px; background: var(--surface); padding: 16px; border: 1px solid var(--border); border-radius: 12px; }
    .search-box { flex: 1; position: relative; }
    .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-box input { width: 100%; background: #0d0d0d; border: 1px solid var(--border); padding: 10px 14px 10px 40px; border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border .2s; }
    .search-box input:focus { border-color: var(--accent); }
    .filter-select { background: #0d0d0d; border: 1px solid var(--border); color: var(--text); padding: 0 16px; border-radius: 8px; font-family: inherit; font-size: 14px; outline: none; cursor: pointer; }

    /* TABLE */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 24px; overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
    th { padding: 14px 16px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid var(--border); font-weight: 600; }
    td { padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.02); vertical-align: middle; }
    tr:hover td { background: rgba(255, 255, 255, 0.01); }

    .user-info { display: flex; align-items: center; gap: 12px; }
    .avatar-circle { width: 36px; height: 36px; background: #222; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 600; border: 1px solid var(--border); overflow: hidden; }
    .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
    
    .badge { padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; display: inline-block; }
    .badge-admin { background: rgba(239, 68, 68, 0.15); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }
    .badge-user { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.2); }

    .btn-action { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; transition: all .2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-action:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* MODAL DETAILED */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: all .3s ease; z-index: 1000; padding: 20px; }
    .modal.open { opacity: 1; pointer-events: auto; }
    .modal-content { background: var(--surface); border: 1px solid var(--border); width: 100%; max-width: 460px; border-radius: 16px; padding: 28px; position: relative; transform: translateY(-20px); transition: transform .3s ease; }
    .modal.open .modal-content { transform: translateY(0); }
    .modal-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; }
    .modal-close:hover { color: var(--text); }
    .modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 24px; letter-spacing: 1px; margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    
    .detail-list { display: flex; flex-direction: column; gap: 14px; }
    .detail-item { display: flex; align-items: center; gap: 14px; background: #0d0d0d; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--border); }
    .detail-icon { color: var(--accent); font-size: 16px; width: 20px; text-align: center; }
    .detail-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .detail-value { font-size: 14px; font-weight: 500; margin-top: 2px; }
  </style>
</head>
<body>

  <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin(activePage='users')}"></div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title">Quản lý người dùng hệ thống</div>
      <span class="admin-badge">Quản trị viên</span>
    </div>

    <div class="content">
      <div class="page-header">
        <div>
          <h1 class="page-heading">Danh sách tài khoản</h1>
          <p class="page-sub">Quản lý toàn bộ thông tin khách hàng và phân quyền hệ thống</p>
        </div>
      </div>

      <div class="tool-bar">
        <div class="search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="inp-search" placeholder="Tìm kiếm theo tên hoặc số điện thoại..." oninput="handleFilterUsers()"/>
        </div>
        <select class="filter-select" id="sel-role" onchange="handleFilterUsers()">
          <option value="ALL">Tất cả quyền hạn</option>
          <option value="ADMIN">Quản trị viên (Admin)</option>
          <option value="USER">Khách hàng (User)</option>
        </select>
      </div>

      <div class="card">
        <table>
          <thead>
            <tr>
              <th>Mã ID</th>
              <th>Họ tên tài khoản</th>
              <th>Số điện thoại</th>
              <th>Vai trò</th>
              <th style="text-align: right;">Hành động</th>
            </tr>
          </thead>
          <tbody id="tbl-users-body">
            <tr>
              <td colspan="5" style="text-align: center; color: var(--muted); padding: 30px;">
                <i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu khách hàng...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="modal" id="modal-detail">
    <div class="modal-content">
      <button class="modal-close" onclick="closeDetailModal()"><i class="fa-solid fa-xmark"></i></button>
      <h3 class="modal-title"><i class="fa-solid fa-id-card"></i> Chi tiết hồ sơ tài khoản</h3>
      <div class="detail-list" id="box-user-detail">
        </div>
    </div>
  </div>

  <script>
    // ĐÃ SỬA API ĐÚNG THÀNH /api/admin/users
    const API_USER = '/api/admin/users';
    let localUsersList = [];

    document.addEventListener('DOMContentLoaded', fetchSystemUsers);

    async function fetchSystemUsers() {
      try {
        const response = await fetch(API_USER);
        if (!response.ok) throw new Error('Không phản hồi dữ liệu từ server');
        
        localUsersList = await response.json();
        renderUsersTable(localUsersList);
      } catch (err) {
        console.error('Lỗi fetch dữ liệu user:', err);
        document.getElementById('tbl-users-body').innerHTML = `
          <tr>
            <td colspan="5" style="text-align: center; color: var(--danger); padding: 30px;">
              <i class="fa-solid fa-circle-exclamation"></i> Không thể kết nối lấy dữ liệu. Bạn hãy F5 tải lại trang.
            </td>
          </tr>`;
      }
    }

    function renderUsersTable(users) {
      const tbody = document.getElementById('tbl-users-body');
      if (users.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:var(--muted); padding:20px;">Không có tài khoản nào phù hợp.</td></tr>`;
        return;
      }

      tbody.innerHTML = users.map(u => {
        const id = u.id || u.userId;
        const name = u.hoTen || u.username || 'Chưa đặt tên';
        const phone = u.sdt || 'Chưa cập nhật';
        const role = (u.roleAdmin === true || u.role === 'ADMIN') ? 'ADMIN' : 'USER';
        
        const firstLetter = name.charAt(0).toUpperCase();
        const avatarHtml = u.anh 
          ? `<img src="${u.anh}" alt="avatar" onerror="this.parentElement.innerHTML='${firstLetter}'">`
          : firstLetter;

        return `
          <tr>
            <td><b>#${id}</b></td>
            <td>
              <div class="user-info">
                <div class="avatar-circle">${avatarHtml}</div>
                <div>
                  <div style="font-weight:600; color:var(--text)">${name}</div>
                </div>
              </div>
            </td>
            <td style="color:var(--muted)">${phone}</td>
            <td>
              ${role === 'ADMIN' 
                ? '<span class="badge badge-admin"><i class="fa-solid fa-user-shield"></i> Admin</span>' 
                : '<span class="badge badge-user"><i class="fa-solid fa-user"></i> Khách</span>'}
            </td>
            <td style="text-align: right;">
              <button class="btn-action" onclick="showUserDetail(${id})">
                <i class="fa-solid fa-eye"></i> Xem hồ sơ
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function handleFilterUsers() {
      const keyword = document.getElementById('inp-search').value.toLowerCase().trim();
      const roleFilter = document.getElementById('sel-role').value;

      const filtered = localUsersList.filter(u => {
        const name = (u.hoTen || u.username || '').toLowerCase();
        const phone = (u.sdt || '').toLowerCase();
        const role = (u.roleAdmin === true || u.role === 'ADMIN') ? 'ADMIN' : 'USER';

        const matchesSearch = name.includes(keyword) || phone.includes(keyword);
        const matchesRole = (roleFilter === 'ALL') || (role === roleFilter);

        return matchesSearch && matchesRole;
      });

      renderUsersTable(filtered);
    }

    function showUserDetail(id) {
      const u = localUsersList.find(x => (x.id === id || x.userId === id));
      if (!u) return;

      const name = u.hoTen || u.username || 'Chưa cập nhật';
      const address = u.diaChi || 'Chưa có thông tin địa chỉ giao hàng';
      const phone = u.sdt || 'Chưa cập nhật số điện thoại';
      const role = (u.roleAdmin === true || u.role === 'ADMIN') ? 'ADMIN' : 'USER';

      document.getElementById('box-user-detail').innerHTML = `
        <div class="detail-item">
          <div class="detail-icon"><i class="fa-solid fa-circle-user"></i></div>
          <div>
            <div class="detail-label">Họ và Tên</div>
            <div class="detail-value">${name}</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-icon"><i class="fa-solid fa-id-badge"></i></div>
          <div>
            <div class="detail-label">Mã tài khoản</div>
            <div class="detail-value">#${u.id || u.userId}</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-icon"><i class="fa-solid fa-phone"></i></div>
          <div>
            <div class="detail-label">Số điện thoại</div>
            <div class="detail-value">${phone}</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-icon"><i class="fa-solid fa-location-dot"></i></div>
          <div>
            <div class="detail-label">Địa chỉ giao hàng</div>
            <div class="detail-value" style="font-size:13px; line-height:1.4;">${address}</div>
          </div>
        </div>
        <div class="detail-item">
          <div class="detail-icon"><i class="fa-solid fa-shield-halved"></i></div>
          <div>
            <div class="detail-label">Cấp bậc quyền lực</div>
            <div class="detail-value">${role === 'ADMIN' ? 'Ban Quản Trị (Admin)' : 'Khách Mua Hàng (User)'}</div>
          </div>
        </div>
      `;

      document.getElementById('modal-detail').classList.add('open');
    }

    function closeDetailModal() {
      document.getElementById('modal-detail').classList.remove('open');
    }
  </script>
</body>
</html>
