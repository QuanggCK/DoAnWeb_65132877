<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Điều Chỉnh Quảng Cáo - Admin</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #ff5c00;
      --accent2: #ffb800;
      --text: #f0ece4;
      --muted: #6b6b6b;
      --success: #22c55e;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      display: flex;
    }

    /* ==========================================
       BỘ CSS SIDEBAR ĐỒNG BỘ TỪ ADMINPAGE
       ========================================== */
    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
      left: 0;
      top: 0;
    }
    .sidebar-logo {
      padding: 30px 24px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 1.5px;
      color: var(--accent);
      line-height: 1;
    }
    .sidebar-logo .sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 4px;
    }
    .nav {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .nav-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 16px 8px 8px 8px;
      font-weight: 600;
    }
    .nav-section:first-child { padding-top: 0; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-item .icon {
      width: 20px;
      display: flex;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
      transition: color 0.2s ease;
    }
    .nav-item:hover {
      background: #1e1e1e;
      color: #fff;
    }
    .nav-item:hover .icon {
      color: var(--text);
    }
    .nav-item.active {
      background: linear-gradient(135deg, #ff5c00 0%, #ff3d00 100%);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 92, 0, 0.2);
    }
    .nav-item.active .icon {
      color: #fff;
    }
    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }
    .btn-logout {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--danger);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn-logout:hover { opacity: 0.8; }

    /* Main Content Style */
    .main-content {
      margin-left: 240px;
      padding: 40px;
      width: calc(100% - 240px);
      display: flex;
      flex-direction: column;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    .page-title {
      font-family: 'Bebas Neue', cursive;
      font-size: 32px;
      letter-spacing: 1px;
      color: var(--accent);
    }
    .page-sub {
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
    }

    /* Card & Form Style */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 30px;
      max-width: 800px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
    }
    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      transition: 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent);
    }
    textarea.form-control {
      resize: vertical;
      min-height: 100px;
    }
    
    /* Buttons */
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      font-family: inherit;
      transition: 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--border); color: var(--text); }
    
    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: var(--surface);
      border-left: 4px solid var(--accent);
      color: var(--text);
      padding: 16px 24px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateX(120%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }
    .toast.show { transform: translateX(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }
    .toast i { font-size: 20px; }
    .toast.success i { color: var(--success); }
    .toast.error i { color: var(--danger); }
  </style>
</head>
<body>

  <div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin(activePage='quang-cao')}"></div>

  <main class="main-content">
    <header class="header">
      <div>
        <h1 class="page-title">Điều Chỉnh Quảng Cáo</h1>
        <p class="page-sub">Cập nhật thông tin chiến dịch truyền thông</p>
      </div>
      <a href="/admin/quang-cao" class="btn btn-secondary">
        <i class="fa-solid fa-arrow-left"></i> Quay lại
      </a>
    </header>

    <div class="card">
      <form id="adjustForm">
        <div class="form-group">
          <label class="form-label">Tiêu đề quảng cáo</label>
          <input type="text" id="tieuDe" class="form-control" required placeholder="Nhập tiêu đề...">
        </div>
        
        <div class="form-group">
          <label class="form-label">Nội dung chi tiết</label>
          <textarea id="noiDung" class="form-control" rows="4" required placeholder="Nhập nội dung quảng cáo..."></textarea>
        </div>
        
        <div class="form-group">
          <label class="form-label">Hình ảnh</label>
          <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="hinhAnh" class="form-control" placeholder="VD: banner-khuyen-mai.jpg" readonly style="flex: 1; background: rgba(255,255,255,0.05);" />
            <input type="file" id="uploadHinh" style="display: none;" accept="image/*">
            <button type="button" class="btn btn-secondary" style="white-space: nowrap;" onclick="document.getElementById('uploadHinh').click()">
              <i class="fa-solid fa-folder-open"></i> Tìm trong máy
            </button>
          </div>
        </div>
        
        <div class="form-group" id="previewContainer" style="display: none;">
          <label class="form-label">Xem trước ảnh:</label>
          <img id="imgPreview" src="" alt="Preview" style="max-width: 300px; border-radius: 8px; border: 1px solid var(--border);">
        </div>
        
        <div class="form-group">
          <label class="form-label">Trạng thái hiển thị</label>
          <select id="trangThai" class="form-control">
            <option value="true">Hiển thị (Active)</option>
            <option value="false">Ẩn (Inactive)</option>
          </select>
        </div>
        
        <div style="text-align: right; margin-top: 30px;">
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Lưu thay đổi
          </button>
        </div>
      </form>
    </div>
  </main>

  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check" id="toast-icon"></i>
    <span id="toast-msg">Thông báo</span>
  </div>

  <script>
    const API = '/api/admin/quang-cao';
    
    function toast(msg, type = 'success') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.className = `toast show ${type}`;
      const icon = document.getElementById('toast-icon');
      icon.className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
      setTimeout(() => t.classList.remove('show'), 3000);
    }

    const urlParams = new URLSearchParams(window.location.search);
    const qcId = urlParams.get('id');

    if (!qcId) {
      alert("Không tìm thấy ID quảng cáo!");
      window.location.href = '/admin/quang-cao';
    }

    document.addEventListener('DOMContentLoaded', () => {
      fetch(`${API}/${qcId}`)
        .then(res => {
          if (!res.ok) throw new Error("Không tìm thấy dữ liệu quảng cáo!");
          return res.json();
        })
        .then(data => {
          document.getElementById('tieuDe').value = data.tieuDe || data.tieude || '';
          document.getElementById('noiDung').value = data.noiDung || data.noidung || '';
          document.getElementById('hinhAnh').value = data.hinhAnh || data.hinhanh || '';
          const status = data.trangThai !== undefined ? data.trangThai : data.trangthai;
          document.getElementById('trangThai').value = status ? 'true' : 'false';

          if (data.hinhAnh || data.hinhanh) {
            const imgName = data.hinhAnh || data.hinhanh;
            const imgPreview = document.getElementById('imgPreview');
            
            // Check paths dynamically
            if (imgName.includes('_')) {
              imgPreview.src = `/images/${imgName}`;
            } else {
              imgPreview.src = `/images/quang-cao/${imgName}`;
            }
            
            imgPreview.onerror = function() {
              if (this.src.indexOf('/images/quang-cao/') !== -1) {
                this.src = `/images/announcements/${imgName}`;
              } else {
                this.src = `/images/announcements/${imgName}`;
              }
            };
            
            document.getElementById('previewContainer').style.display = 'block';
          }
        })
        .catch(error => {
          console.error("Lỗi:", error);
          toast("Lỗi tải thông tin quảng cáo!", "error");
        });
    });

    // Handle local file selection and upload using HTML5 File structure
    document.getElementById('uploadHinh').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('file', file);
      formData.append('type', 'ad'); // ad maps directly to static/images/

      fetch('/api/admin/upload', {
        method: 'POST',
        body: formData
      })
      .then(res => {
        if (!res.ok) throw new Error("Không thể upload file!");
        return res.json();
      })
      .then(data => {
        document.getElementById('hinhAnh').value = data.fileName;
        const imgPreview = document.getElementById('imgPreview');
        imgPreview.src = data.filePath;
        document.getElementById('previewContainer').style.display = 'block';
        toast("Tải ảnh từ máy thành công!");
      })
      .catch(err => {
        console.error(err);
        toast("Lỗi upload: " + err.message, "error");
      });
    });

    document.getElementById('adjustForm').addEventListener('submit', function (e) {
      e.preventDefault();
      
      const bodyData = {
        tieuDe: document.getElementById('tieuDe').value.trim(),
        noiDung: document.getElementById('noiDung').value.trim(),
        hinhAnh: document.getElementById('hinhAnh').value.trim() || null,
        trangThai: document.getElementById('trangThai').value === 'true'
      };

      fetch(`${API}/${qcId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
      })
      .then(async (res) => {
        if (!res.ok) {
          const err = await res.text();
          throw new Error(err || "Cập nhật thất bại!");
        }
        return res.json();
      })
      .then(() => {
        toast("Cập nhật quảng cáo thành công!");
        setTimeout(() => {
          window.location.href = '/admin/quang-cao';
        }, 1500);
      })
      .catch(error => {
        console.error("Lỗi:", error);
        toast(error.message, "error");
      });
    });
  </script>
</body>
</html>
