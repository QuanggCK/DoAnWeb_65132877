<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quảng Cáo – Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #ff5c00;
      --text: #f0ece4;
      --muted: #6b6b6b;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; display: flex; min-height: 100vh; }
    
    /* BỘ CSS SIDEBAR ADMIN ĐỒNG BỘ DARK MODE */
    /* ==========================================
       BỘ CSS SIDEBAR ĐỒNG BỘ TỪ ADMINPAGE
       ========================================== */
    .sidebar {
      width: 240px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      height: 100vh;
      z-index: 100;
      left: 0;
      top: 0;
    }
    .sidebar-logo {
      padding: 30px 24px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-logo .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 1.5px;
      color: var(--accent);
      line-height: 1;
    }
    .sidebar-logo .sub {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-top: 4px;
    }
    .nav {
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      overflow-y: auto;
    }
    .nav-section {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      padding: 16px 8px 8px 8px;
      font-weight: 600;
    }
    .nav-section:first-child { padding-top: 0; }
    .nav-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      color: var(--text);
      text-decoration: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.2s ease;
    }
    .nav-item .icon {
      width: 20px;
      display: flex;
      justify-content: center;
      color: var(--muted);
      font-size: 16px;
      transition: color 0.2s ease;
    }
    .nav-item:hover {
      background: #1e1e1e;
      color: #fff;
    }
    .nav-item:hover .icon {
      color: var(--text);
    }
    .nav-item.active {
      background: linear-gradient(135deg, #ff5c00 0%, #ff3d00 100%);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(255, 92, 0, 0.2);
    }
    .nav-item.active .icon {
      color: #fff;
    }
    .sidebar-footer {
      padding: 20px 24px;
      border-top: 1px solid var(--border);
    }
    .btn-logout {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--danger);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.2s;
    }
    .btn-logout:hover { opacity: 0.8; }

    .main-content { margin-left: 240px; padding: 40px; width: calc(100% - 240px); display: flex; flex-direction: column; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .page-title { font-family: 'Bebas Neue', cursive; font-size: 32px; color: var(--accent); letter-spacing: 1px; }
    .page-sub { color: var(--muted); font-size: 14px; margin-top: 4px; }
    .btn { padding: 10px 20px; background: var(--accent); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; font-family: inherit; }
    .btn:hover { opacity: 0.9; }
    
    /* Bảng dữ liệu */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; flex: 1; }
    .controls { padding: 20px; display: flex; gap: 16px; border-bottom: 1px solid var(--border); }
    .search-box { flex: 1; position: relative; }
    .search-box i { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-box input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px 16px 10px 40px; border-radius: 6px; outline: none; }
    .search-box input:focus { border-color: var(--accent); }
    
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; padding: 16px 20px; color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; border-bottom: 1px solid var(--border); }
    td { padding: 16px 20px; border-bottom: 1px solid var(--border); font-size: 14px; vertical-align: middle; }
    .thumb { width: 80px; height: 50px; object-fit: cover; border-radius: 6px; }
    .text-ellipsis { max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Toggle Switch */
    .toggle { width: 44px; height: 24px; background: var(--border); border-radius: 12px; position: relative; cursor: pointer; transition: 0.3s; }
    .toggle .knob { width: 18px; height: 18px; background: #fff; border-radius: 50%; position: absolute; top: 3px; left: 3px; transition: 0.3s; }
    .toggle.active { background: var(--success); }
    .toggle.active .knob { left: 23px; }
    
    /* Action buttons */
    .action-btn { width: 32px; height: 32px; border: none; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; transition: 0.2s; }
    .action-btn.edit { background: rgba(255, 92, 0, 0.1); color: var(--accent); }
    .action-btn.edit:hover { background: var(--accent); color: #fff; }
    .action-btn.delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); margin-left: 6px; }
    .action-btn.delete:hover { background: var(--danger); color: #fff; }
    
    /* Modal / Form */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7); display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 999; }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal { background: var(--surface); width: 500px; border-radius: 12px; padding: 24px; border: 1px solid var(--border); transform: translateY(20px); transition: 0.3s; }
    .modal-overlay.open .modal { transform: translateY(0); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-title { font-size: 20px; font-weight: 600; }
    .close-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 8px; font-size: 13px; color: var(--text); font-weight: 500; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 10px; border-radius: 6px; outline: none; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent); }
    
    /* Toast */
    .toast { position: fixed; bottom: 30px; right: 30px; background: var(--surface); border-left: 4px solid var(--accent); color: var(--text); padding: 16px 24px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; transform: translateX(120%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1000; }
    .toast.show { transform: translateX(0); }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--danger); }

    /* Footer Styles */
    .footer-admin { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }
    .footer-admin__left { display: flex; align-items: center; gap: 8px; }
    .footer-admin__brand { color: var(--accent); font-family: 'Bebas Neue', cursive; font-size: 18px; letter-spacing: 1px; }
  </style>
</head>
<body>

<div th:replace="~{fragments/sidebarAdmin :: sidebarAdmin(activePage='quang-cao')}"></div>

<main class="main-content">
  <header class="header">
    <div>
      <h1 class="page-title">Quản Lý Quảng Cáo</h1>
      <p class="page-sub">Quản lý banner và thông báo trên trang chủ</p>
    </div>
    <button class="btn" onclick="openModal()"><i class="fa-solid fa-plus"></i> Thêm quảng cáo</button>
  </header>
  
  <div class="card">
    <div class="controls">
      <div class="search-box">
        <i class="fa-solid fa-search"></i>
        <input type="text" id="search-input" placeholder="Tìm kiếm theo tiêu đề..." oninput="filterAndRender()">
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Hình ảnh</th>
          <th>Tiêu đề</th>
          <th>Nội dung</th>
          <th>Trạng thái</th>
          <th>Thao tác</th>
        </tr>
      </thead>
      <tbody id="table-body">
        </tbody>
    </table>
  </div>

  <div th:replace="~{fragments/foooterAdmin}">
    <footer class="footer-admin">
      <div class="footer-admin__left">
        <span class="footer-admin__brand">ADMIN</span>
        <span class="footer-admin__copy">© 2025 Hệ thống quản trị nội bộ.</span>
      </div>
    </footer>
  </div>

</main>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Thêm Quảng Cáo Mới</div>
      <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="form-group">
      <label>Tiêu đề</label>
      <input type="text" id="f-tieude" placeholder="Nhập tiêu đề...">
    </div>
    <div class="form-group">
      <label>Nội dung</label>
      <textarea id="f-noidung" rows="3" placeholder="Nhập nội dung..."></textarea>
    </div>
    <div class="form-group">
      <label>Hình ảnh</label>
      <div style="display: flex; gap: 10px; align-items: center;">
        <input type="text" id="f-hinh" placeholder="VD: banner-1.jpg" readonly style="flex: 1; background: rgba(255,255,255,0.05);">
        <input type="file" id="f-file" style="display: none;" accept="image/*">
        <button type="button" class="btn" style="white-space: nowrap; padding: 10px 14px;" onclick="document.getElementById('f-file').click()"><i class="fa-solid fa-folder-open"></i> Tìm trong máy</button>
      </div>
      <div id="f-preview-container" style="margin-top: 10px; display: none;">
        <img id="f-preview" style="max-height: 100px; border-radius: 6px; border: 1px solid var(--border);" alt="Preview">
      </div>
    </div>
    <div class="form-group">
      <label>Trạng thái</label>
      <select id="f-trangthai">
        <option value="true">Hiển thị (Active)</option>
        <option value="false">Ẩn (Inactive)</option>
      </select>
    </div>
    <div style="text-align:right;margin-top:20px;">
      <button class="btn" onclick="saveData()">Lưu Quảng Cáo</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-del">
  <div class="modal" style="width: 420px; text-align: center;">
    <div class="modal-header" style="justify-content: center; margin-bottom: 12px;">
      <div class="modal-title" style="color: var(--danger); font-size: 18px;">
        <i class="fa-solid fa-circle-exclamation"></i> Xác Nhận Xóa
      </div>
    </div>
    <p id="confirm-msg" style="margin-bottom: 24px; color: var(--text); font-size: 14px;"></p>
    <div style="display: flex; justify-content: center; gap: 12px;">
      <button class="btn" style="background: var(--border); color: var(--text);" onclick="closeConfirm()">Hủy</button>
      <button class="btn" style="background: var(--danger);" onclick="confirmDelete()">Xóa Bản Ghi</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">
  <i class="fa-solid fa-circle-check" id="toast-icon"></i>
  <span id="toast-msg"></span>
</div>

<script>
  const API = '/api/admin';
  let allData = [];
  let id = null;       
  let deleteId = null; 
  
  function toast(msg, type='success'){
    const t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    t.className = `toast show ${type}`;
    document.getElementById('toast-icon').className = type === 'success' ? 'fa-solid fa-circle-check' : 'fa-solid fa-circle-exclamation';
    setTimeout(() => t.classList.remove('show'), 3000);
  }
  
  async function apiFetch(path, method='GET', body=null){
    const opts = {method, headers:{'Content-Type':'application/json'}};
    if(body) opts.body = JSON.stringify(body);
    const res = await fetch(API + path, opts);
    if(!res.ok) throw new Error(await res.text() || "Lỗi khi gọi API!");
    return res.json();
  }
  
  document.addEventListener('DOMContentLoaded', async () => {
    await loadData();
  });
  
  async function loadData() {
    try {
      const data = await apiFetch('/quang-cao');
      allData = Array.isArray(data) ? data : [];
      filterAndRender();
    } catch(e) {
      document.getElementById('table-body').innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--danger);padding:20px;">Lỗi tải dữ liệu: ${e.message}</td></tr>`;
    }
  }
  
  function filterAndRender(){
    const tbody = document.getElementById('table-body');
    const q = document.getElementById('search-input').value.toLowerCase();
    
    // Hỗ trợ cả trường hợp thuộc tính viết hoa hoặc viết thường từ API trả về
    const d = allData.filter(x => {
      const title = x.tieuDe || x.tieude || '';
      return title.toLowerCase().includes(q);
    });
    
    if(d.length === 0){
      tbody.innerHTML = `<tr>
        <td colspan="6" style="text-align:center;padding:50px;color:var(--muted);">
          <i class="fa-solid fa-bullhorn" style="font-size:40px;margin-bottom:16px;"></i><br/>
          <span style="font-size:16px;">Bảng đang trống hoặc không tìm thấy kết quả phù hợp.</span>
        </td>
      </tr>`;
      return;
    }
    
    tbody.innerHTML = d.map(x => {
        const title = x.tieuDe || x.tieude || '(Không có tiêu đề)';
        const content = x.noiDung || x.noidung || '';
        const image = x.hinhAnh || x.hinhanh || '';
        const status = x.trangThai !== undefined ? x.trangThai : x.trangthai;

        let imgSrc = '<div class="thumb" style="display:flex;align-items:center;justify-content:center;background:var(--border);color:var(--muted);font-size:10px">NO IMG</div>';
        if (image) {
            // Đảm bảo đường dẫn luôn bắt đầu với thư mục /images/quang-cao/
            let exactPath = image.startsWith('/') ? image : ('/images/quang-cao/' + image);
            // Xóa bỏ hàm onerror lồng nhau phức tạp, nếu lỗi thì chỉ gán 1 ảnh mặc định duy nhất
            imgSrc = `<img src="${exactPath}" class="thumb" alt="IMG" onerror="this.onerror=null; this.src='/images/no-image.png';"/>`;
        }
        
        return `
        <tr>
          <td>${x.id}</td>
          <td>${imgSrc}</td>
          <td style="font-weight:500; color:var(--text);">${title}</td>
          <td class="text-ellipsis">${content}</td>
          <td>
            <div class="toggle ${status ? 'active' : ''}" onclick="toggleStatus(${x.id}, ${!status})"><div class="knob"></div></div>
          </td>
          <td>
            <button class="action-btn edit" title="Sửa" onclick="window.location.href='/admin/quang-cao/adjust?id=${x.id}'"><i class="fa-solid fa-pen"></i></button>
            <button class="action-btn delete" title="Xóa" onclick="askDelete(${x.id})"><i class="fa-solid fa-trash"></i></button>
          </td>
        </tr>
      `;
    }).join('');
  }
  
  async function toggleStatus(id, newState){
    try {
      const qc = allData.find(x => x.id === id);
      if(!qc) return;
      
      const bodyData = {
          tieuDe: qc.tieuDe || qc.tieude,
          noiDung: qc.noiDung || qc.noidung,
          hinhAnh: qc.hinhAnh || qc.hinhanh,
          trangThai: newState
      };
      
      await apiFetch('/quang-cao/' + id, 'PUT', bodyData);
      if (qc.trangThai !== undefined) qc.trangThai = newState;
      if (qc.trangthai !== undefined) qc.trangthai = newState;
      filterAndRender();
      toast('Đã cập nhật trạng thái hiển thị!');
    } catch(e) {
      toast('Lỗi: ' + e.message, 'error');
    }
  }
  
  function openModal(){
    id = null;
    document.getElementById('f-tieude').value = '';
    document.getElementById('f-noidung').value = '';
    document.getElementById('f-hinh').value = '';
    document.getElementById('f-trangthai').value = 'true';
    document.getElementById('f-file').value = '';
    document.getElementById('f-preview-container').style.display = 'none';
    document.getElementById('f-preview').src = '';
    document.getElementById('modal').classList.add('open');
  }
  function closeModal(){
    document.getElementById('modal').classList.remove('open');
  }

  // Handle local file selection and upload using HTML5 File structure
  document.getElementById('f-file').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (!file) return;

    const formData = new FormData();
    formData.append('file', file);
    formData.append('type', 'ad'); // ad maps directly to static/images/

    fetch('/api/admin/upload', {
      method: 'POST',
      body: formData
    })
    .then(res => {
      if (!res.ok) throw new Error("Không thể upload file!");
      return res.json();
    })
    .then(data => {
      document.getElementById('f-hinh').value = data.fileName;
      const imgPreview = document.getElementById('f-preview');
      imgPreview.src = data.filePath;
      document.getElementById('f-preview-container').style.display = 'block';
      toast("Tải ảnh từ máy thành công!");
    })
    .catch(err => {
      console.error(err);
      toast("Lỗi upload: " + err.message, "error");
    });
  });
  
  async function saveData(){
    const tieude = document.getElementById('f-tieude').value.trim();
    if(!tieude) { toast('Vui lòng nhập tiêu đề!', 'error'); return; }
    
    const bodyData = {
        tieuDe: tieude,
        noiDung: document.getElementById('f-noidung').value.trim(),
        hinhAnh: document.getElementById('f-hinh').value.trim() || null,
        trangThai: document.getElementById('f-trangthai').value === 'true'
    };
    if(id) bodyData.id = parseInt(id);
    
    try {
      if(id) await apiFetch('/quang-cao/' + id, 'PUT', bodyData);
      else await apiFetch('/quang-cao', 'POST', bodyData);
      
      toast(id ? 'Cập nhật thành công!' : 'Thêm quảng cáo thành công!');
      closeModal();
      const data = await apiFetch('/quang-cao');
      allData = Array.isArray(data) ? data : [];
      filterAndRender();
    } catch(e) {
      toast('Lỗi: ' + e.message, 'error');
    }
  }

  // Cải tiến an toàn tuyệt đối: Tìm kiếm tên trực tiếp từ bộ nhớ bằng ID, miễn nhiễm hoàn toàn lỗi vỡ chuỗi HTML
  function askDelete(targetId){
    deleteId = targetId;
    const qc = allData.find(x => x.id === targetId);
    const name = qc ? (qc.tieuDe || qc.tieude || 'Quảng cáo') : 'Quảng cáo';
    document.getElementById('confirm-msg').textContent = `Bạn có chắc chắn muốn xóa quảng cáo "${name}" không? Hành động này không thể hoàn tác.`;
    document.getElementById('confirm-del').classList.add('open');
  }
  function closeConfirm(){
    deleteId = null;
    document.getElementById('confirm-del').classList.remove('open');
  }
  async function confirmDelete(){
    if(!deleteId) return;
    try {
      const res = await fetch(API + '/quang-cao/' + deleteId, { method: 'DELETE' });
      if(!res.ok) throw new Error(await res.text() || "Lỗi khi xóa quảng cáo");
      
      toast('Đã xóa quảng cáo thành công!');
      closeConfirm();
      allData = allData.filter(d => d.id !== deleteId);
      filterAndRender();
    } catch(e) {
      toast('Lỗi: ' + e.message, 'error');
    }
  }
</script>
</body>
</html>
